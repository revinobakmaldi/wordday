name: WordDay
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  WordDay:
    type: application
    platform: iOS
    sources:
      - path: WordDay
        excludes:
          - "WordDay.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wordday
        PRODUCT_NAME: WordDay
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: WordDay/WordDay.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: WordDay
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - target: WordDayWidgetExtension

  WordDayWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WordDayWidget
        excludes:
          - "WordDayWidget.entitlements"
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wordday.widget
        PRODUCT_NAME: WordDayWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WordDayWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: WordDayWidget/WordDayWidget.entitlements
        SKIP_INSTALL: YES

schemes:
  WordDay:
    build:
      targets:
        WordDay: all
    run:
      config: Debug
    archive:
      config: Release
